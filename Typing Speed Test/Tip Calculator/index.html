<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-200 to-purple-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Tip Calculator</h1>
        <form id="tipForm" class="space-y-4">
            <!-- Bill Amount -->
            <div>
                <label for="bill" class="block text-sm font-medium text-gray-700">Bill Amount ($)</label>
                <input type="number" id="bill" name="bill" step="0.01" min="0" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter bill amount" required>
            </div>

            <!-- Tip Percentage -->
            <div>
                <p class="block text-sm font-medium text-gray-700">Tip Percentage</p>
                <div class="flex space-x-2 mt-2">
                    <button type="button" class="tip-btn bg-gray-200 p-2 rounded-lg hover:bg-gray-300" data-tip="10">10%</button>
                    <button type="button" class="tip-btn bg-gray-200 p-2 rounded-lg hover:bg-gray-300" data-tip="15">15%</button>
                    <button type="button" class="tip-btn bg-gray-200 p-2 rounded-lg hover:bg-gray-300" data-tip="20">20%</button>
                    <input type="number" id="customTip" name="customTip" min="0" class="w-20 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Custom %">
                </div>
            </div>

            <!-- Number of People -->
            <div>
                <label for="people" class="block text-sm font-medium text-gray-700">Number of People</label>
                <input type="number" id="people" name="people" min="1" value="1" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="text-red-500 text-sm text-center"></div>

            <!-- Calculate Button -->
            <button type="submit" class="w-full bg-purple-500 text-white p-2 rounded-lg hover:bg-purple-600">Calculate</button>
        </form>

        <!-- Result Display -->
        <div id="result" class="hidden mt-6 p-4 bg-purple-100 rounded-lg text-center">
            <h2 class="text-lg font-semibold text-purple-800">Results</h2>
            <p id="tipAmount" class="text-gray-700"></p>
            <p id="totalPerPerson" class="text-gray-700"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
