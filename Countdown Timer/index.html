<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-purple-200 to-blue-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Countdown Timer</h1>
        <div class="input-section mb-6">
            <input type="datetime-local" id="targetDate" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 mb-2">
            <button onclick="startCountdown()" class="w-full bg-purple-500 text-white p-2 rounded-lg hover:bg-purple-600">Start Timer</button>
        </div>
        <div id="timer" class="text-3xl font-mono text-purple-600 text-center">
            <div class="flex justify-center space-x-4">
                <div><span id="days">0</span><br>Days</div>
                <div><span id="hours">0</span><br>Hours</div>
                <div><span id="minutes">0</span><br>Minutes</div>
                <div><span id="seconds">0</span><br>Seconds</div>
            </div>
        </div>
        <div id="message" class="text-center text-red-500 mt-4"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
