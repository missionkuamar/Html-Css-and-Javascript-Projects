<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-purple-200 to-blue-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Palindrome Checker</h1>
        <form id="palindromeForm" class="space-y-4">
            <!-- Input Word -->
            <div>
                <label for="word" class="block text-sm font-medium text-gray-700">Enter Word or Phrase</label>
                <input type="text" id="word" name="word" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter a word or phrase" required>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="text-red-500 text-sm text-center"></div>

            <!-- Check Button -->
            <button type="submit" class="w-full bg-purple-500 text-white p-2 rounded-lg hover:bg-purple-600">Check Palindrome</button>
        </form>

        <!-- Result Display -->
        <div id="result" class="hidden mt-6 p-4 bg-purple-100 rounded-lg text-center">
            <p id="resultMessage" class="text-gray-700"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
