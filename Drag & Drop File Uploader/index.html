<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop File Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md mx-auto">
        <div 
            id="dropZone"
            class="border-2 border-dashed border-gray-400 rounded-lg p-8 text-center transition-colors duration-300 hover:border-blue-500 bg-white"
        >
            <div class="flex flex-col items-center justify-center space-y-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <h2 class="text-xl font-semibold text-gray-700">Drag & Drop your files here</h2>
                <p class="text-gray-500">or</p>
                <label for="fileInput" class="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition-colors duration-300">
                    Browse Files
                </label>
                <input type="file" id="fileInput" class="hidden" multiple>
            </div>
        </div>

        <div id="previewContainer" class="mt-6 space-y-4 hidden">
            <h3 class="text-lg font-medium text-gray-700">Selected Files:</h3>
            <div id="fileList" class="space-y-2"></div>
            <button id="uploadBtn" class="w-full bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md transition-colors duration-300">
                Upload Files
            </button>
        </div>

        <div id="progressContainer" class="mt-4 hidden">
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm text-gray-600 mt-1">0% uploaded</p>
        </div>

        <div id="statusMessage" class="mt-4 hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
