<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-green-200 to-blue-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-lg">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Survey Form</h1>
        <form id="surveyForm" class="space-y-6">
            <!-- Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="name" name="name" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Enter your name" required>
            </div>

            <!-- Satisfaction -->
            <div>
                <p class="block text-sm font-medium text-gray-700">How satisfied are you with our service?</p>
                <div class="flex space-x-4 mt-2">
                    <label><input type="radio" name="satisfaction" value="Very Satisfied" class="mr-1" required> Very Satisfied</label>
                    <label><input type="radio" name="satisfaction" value="Satisfied" class="mr-1"> Satisfied</label>
                    <label><input type="radio" name="satisfaction" value="Unsatisfied" class="mr-1"> Unsatisfied</label>
                </div>
            </div>

            <!-- Interests -->
            <div>
                <p class="block text-sm font-medium text-gray-700">What features do you value? (Select all that apply)</p>
                <div class="space-y-2 mt-2">
                    <label><input type="checkbox" name="interests" value="Ease of Use" class="mr-1"> Ease of Use</label>
                    <label><input type="checkbox" name="interests" value="Performance" class="mr-1"> Performance</label>
                    <label><input type="checkbox" name="interests" value="Customer Support" class="mr-1"> Customer Support</label>
                </div>
            </div>

            <!-- Feedback -->
            <div>
                <label for="feedback" class="block text-sm font-medium text-gray-700">Additional Feedback</label>
                <textarea id="feedback" name="feedback" rows="4" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Share your thoughts..."></textarea>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="text-red-500 text-sm text-center"></div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-green-500 text-white p-2 rounded-lg hover:bg-green-600">Submit Survey</button>
        </form>

        <!-- Submission Confirmation -->
        <div id="confirmation" class="hidden mt-6 p-4 bg-green-100 rounded-lg">
            <h2 class="text-lg font-semibold text-green-800">Thank You!</h2>
            <p id="confirmationMessage" class="text-gray-700"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
