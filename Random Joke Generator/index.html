<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-yellow-200 to-blue-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Random Joke Generator</h1>
        <div id="joke" class="text-center space-y-4">
            <p id="setup" class="text-lg text-gray-700">Click the button to get a joke!</p>
            <p id="punchline" class="text-lg font-semibold text-gray-800"></p>
        </div>
        <div id="errorMessage" class="text-red-500 text-sm text-center mt-4"></div>
        <button id="getJokeBtn" onclick="fetchJoke()" class="w-full bg-yellow-500 text-white p-2 rounded-lg hover:bg-yellow-600 mt-6">Get New Joke</button>
        <div id="loading" class="hidden text-center text-gray-600 mt-4">Loading...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
