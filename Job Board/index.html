<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-hover { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2); }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
        <!-- Header -->
        <header class="bg-white shadow p-4 rounded-lg mb-6">
            <h1 class="text-3xl font-bold text-center text-gray-800">Job Board</h1>
        </header>

        <!-- Search and Filters -->
        <div class="bg-white shadow p-6 rounded-lg mb-6">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="searchInput" placeholder="Search jobs..." class="w-full md:w-1/3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="locationInput" placeholder="Location" class="w-full md:w-1/3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="jobType" class="w-full md:w-1/3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Job Types</option>
                    <option value="FULLTIME">Full-Time</option>
                    <option value="PARTTIME">Part-Time</option>
                    <option value="CONTRACTOR">Contract</option>
                </select>
                <input type="number" id="salaryInput" placeholder="Min Salary" class="w-full md:w-1/3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Job Listings -->
        <div id="jobListings" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Loading State -->
        <div id="loading" class="text-center hidden">
            <svg class="animate-spin h-8 w-8 mx-auto text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
        </div>

        <!-- Error Message -->
        <div id="error" class="text-red-500 text-center hidden"></div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-center gap-2 mt-6"></div>
    </div>

    <!-- Modal for Job Details -->
    <div id="jobModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg max-w-2xl w-full">
            <h2 id="modalTitle" class="text-2xl font-bold mb-4"></h2>
            <p id="modalCompany" class="text-gray-600 mb-2"></p>
            <p id="modalLocation" class="text-gray-600 mb-2"></p>
            <p id="modalType" class="text-gray-600 mb-2"></p>
            <p id="modalDescription" class="text-gray-800 mb-4"></p>
            <a id="modalApply" href="#" target="_blank" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Apply Now</a>
            <button id="closeModal" class="ml-4 text-gray-500 hover:text-gray-700">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
