<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">Translation App</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 max-w-4xl mx-auto">
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="flex-1">
                    <div class="flex justify-between items-center mb-2">
                        <label for="sourceLang" class="block text-sm font-medium text-gray-700">From:</label>
                        <button id="swapLangs" class="text-blue-500 hover:text-blue-700">
                            <i class="fas fa-exchange-alt"></i>
                        </button>
                    </div>
                    <select id="sourceLang" class="w-full p-2 border border-gray-300 rounded-md">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                        <option value="ar">Arabic</option>
                    </select>
                    <textarea id="sourceText" class="w-full h-40 p-3 mt-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Enter text to translate..."></textarea>
                    <div class="flex justify-between mt-2">
                        <div class="text-sm text-gray-500" id="charCount">0 characters</div>
                        <button id="clearSource" class="text-sm text-red-500 hover:text-red-700">
                            <i class="fas fa-trash-alt mr-1"></i>Clear
                        </button>
                    </div>
                </div>
                
                <div class="flex-1">
                    <label for="targetLang" class="block text-sm font-medium text-gray-700 mb-2">To:</label>
                    <select id="targetLang" class="w-full p-2 border border-gray-300 rounded-md">
                        <option value="es">Spanish</option>
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="zh">Chinese</option>
                        <option value="ja">Japanese</option>
                        <option value="ar">Arabic</option>
                    </select>
                    <textarea id="translatedText" class="w-full h-40 p-3 mt-2 border border-gray-300 rounded-md bg-gray-50" placeholder="Translation will appear here..." readonly></textarea>
                    <div class="flex justify-end mt-2">
                        <button id="copyTranslation" class="text-sm text-blue-500 hover:text-blue-700">
                            <i class="fas fa-copy mr-1"></i>Copy
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-center">
                <button id="translateBtn" class="px-6 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                    <i class="fas fa-language mr-2"></i>Translate
                </button>
            </div>
            
            <div id="loading" class="hidden mt-4 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
                <p class="mt-2 text-gray-600">Translating...</p>
            </div>
            
            <div id="error" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-md text-center"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
