<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-200 to-purple-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">QR Code Generator</h1>
        <form id="qrForm" class="space-y-4">
            <!-- URL Input -->
            <div>
                <label for="url" class="block text-sm font-medium text-gray-700">Enter URL</label>
                <input type="url" id="url" name="url" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://example.com" required>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="text-red-500 text-sm text-center"></div>

            <!-- Generate Button -->
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600">Generate QR Code</button>
        </form>

        <!-- QR Code Display -->
        <div id="qrCode" class="mt-6 flex justify-center"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
