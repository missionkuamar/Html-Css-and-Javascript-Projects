<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Simple Colorful Calculator</title>
 <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
 <link rel="stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
 <div class="calculator bg-white rounded-lg shadow-md p-4 w-full max-w-xs">
 <!-- Display -->
 <div class="display bg-gray-700 text-white text-right p-3 rounded mb-3">
 <div id="output" class="text-2xl">0</div>
 </div>
 <!-- Buttons Container -->
 <div class="flex gap-3">
 <!-- Left Side: Digits and Other Buttons -->
 <div class="grid grid-cols-3 gap-2 flex-1">
 <button class="btn bg-red-400 hover:bg-red-500 text-white" onclick="clearDisplay()">C</button>
 <button class="btn bg-yellow-400 hover:bg-yellow-500 text-white" onclick="appendToDisplay('(')">(</button>
 <button class="btn bg-yellow-400 hover:bg-yellow-500 text-white" onclick="appendToDisplay(')')">)</button>
 
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('7')">7</button>
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('8')">8</button>
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('9')">9</button>
 
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('4')">4</button>
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('5')">5</button>
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('6')">6</button>
 
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick=" appendToDisplay('1')">1</button>
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('2')">2</button>
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('3')">3</button>
 
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('0')">0</button>
 <button class="btn bg-gray-200 hover:bg-gray-300" onclick="appendToDisplay('.')">.</button>
 <button class="btn bg-purple-400 hover:bg-purple-500 text-white" onclick="backspace()">⌫</button>
 </div>
 <!-- Right Side: Operators -->
 <div class="grid grid-cols-1 gap-2">
 <button class="btn bg-green-400 hover:bg-green-500 text-white" onclick="appendToDisplay('/')">/</button>
 <button class="btn bg-green-400 hover:bg-green-500 text-white" onclick="appendToDisplay('*')">×</button>
 <button class="btn bg-green-400 hover:bg-green-500 text-white" onclick="appendToDisplay('-')">-</button>
 <button class="btn bg-green-400 hover:bg-green-500 text-white" onclick="appendToDisplay('+')">+</button>
 <button class="btn bg-blue-400 hover:bg-blue-500 text-white" onclick="calculate()">=</button>
 </div>
 </div>
 <!-- Percentage Button -->
 <div class="mt-2">
 <button class="btn bg-pink-400 hover:bg-pink-500 text-white w-full" onclick="calculatePercentage()">%</button>
 </div>
 </div>
 <script src="script.js"></script>
</body>
</html>
