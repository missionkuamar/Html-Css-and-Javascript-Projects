<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Football Scores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Live Football Scores</h1>
            <p class="text-gray-600">Real-time updates from matches around the world</p>
            <div class="flex justify-center mt-4">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search matches..." 
                           class="px-4 py-2 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 w-64">
                    <button id="searchBtn" class="absolute right-3 top-2 text-gray-500 hover:text-blue-500">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex justify-between mb-6">
            <div class="flex space-x-2">
                <button class="filter-btn active px-4 py-2 rounded-lg bg-blue-500 text-white" data-filter="all">All Matches</button>
                <button class="filter-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300" data-filter="live">Live Now</button>
                <button class="filter-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300" data-filter="upcoming">Upcoming</button>
                <button class="filter-btn px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300" data-filter="finished">Finished</button>
            </div>
            <div>
                <select id="leagueFilter" class="px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">All Leagues</option>
                    <!-- Leagues will be populated by JavaScript -->
                </select>
            </div>
        </div>

        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
            <p class="text-gray-600">Loading matches...</p>
        </div>

        <div id="matchesContainer" class="grid gap-4">
            <!-- Matches will be populated by JavaScript -->
        </div>

        <div id="noMatches" class="hidden text-center py-12">
            <i class="fas fa-frown text-4xl text-gray-400 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-700">No matches found</h3>
            <p class="text-gray-500">Try adjusting your filters or check back later</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
