<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-teal-200 to-blue-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Weather App</h1>
        <div class="search flex space-x-2 mb-4">
            <input type="text" id="cityInput" placeholder="Enter city name" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
            <button onclick="getWeather()" class="bg-teal-500 text-white p-2 rounded-lg hover:bg-teal-600">Search</button>
        </div>
        <div id="weather" class="weather-info text-center">
            <!-- Weather data will be displayed here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
