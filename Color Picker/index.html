<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-200 to-purple-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Color Picker</h1>
        <div class="flex flex-col items-center space-y-4">
            <input type="color" id="colorPicker" value="#ffffff" class="w-24 h-24 cursor-pointer">
            <div id="colorDisplay" class="w-full h-32 rounded-lg border-2 border-gray-300" style="background-color: #ffffff;"></div>
            <div class="text-lg font-mono text-gray-800" id="colorCode">#FFFFFF</div>
            <button onclick="copyToClipboard()" class="bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600 w-full">Copy to Clipboard</button>
            <div id="copyMessage" class="text-green-600 text-center hidden">Copied to clipboard!</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
