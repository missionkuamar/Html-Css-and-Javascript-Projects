<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-200 to-green-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Tic-Tac-Toe</h1>
        <div id="status" class="text-lg text-center text-gray-600 mb-4">Player X's Turn</div>
        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(0)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(1)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(2)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(3)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(4)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(5)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(6)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(7)"></div>
            <div class="cell h-20 bg-gray-100 rounded-lg flex items-center justify-center text-4xl font-bold cursor-pointer" onclick="makeMove(8)"></div>
        </div>
        <button onclick="resetGame()" class="w-full bg-green-500 text-white p-2 rounded-lg hover:bg-green-600">Reset Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
