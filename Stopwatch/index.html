<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-200 to-purple-300 flex items-center justify-center">
    <div class="container bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Stopwatch</h1>
        <div id="display" class="text-4xl font-mono text-center text-gray-800 mb-6">00:00:00.000</div>
        <div class="flex justify-center space-x-4">
            <button id="startBtn" onclick="startStopwatch()" class="bg-green-500 text-white p-2 rounded-lg hover:bg-green-600">Start</button>
            <button id="stopBtn" onclick="stopStopwatch()" class="bg-red-500 text-white p-2 rounded-lg hover:bg-red-600" disabled>Stop</button>
            <button id="resetBtn" onclick="resetStopwatch()" class="bg-gray-500 text-white p-2 rounded-lg hover:bg-gray-600">Reset</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
