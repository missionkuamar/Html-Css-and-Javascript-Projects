<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Solver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Maze Solver</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="width">Width:</label>
                <input type="number" id="width" min="5" max="50" value="20">
            </div>
            <div class="control-group">
                <label for="height">Height:</label>
                <input type="number" id="height" min="5" max="50" value="20">
            </div>
            <div class="control-group">
                <label for="algorithm">Algorithm:</label>
                <select id="algorithm">
                    <option value="dfs">Depth-First Search</option>
                    <option value="bfs">Breadth-First Search</option>
                    <option value="astar">A* Search</option>
                </select>
            </div>
            <button id="generate-btn">Generate Maze</button>
            <button id="solve-btn">Solve Maze</button>
            <button id="clear-btn">Clear Solution</button>
        </div>
        
        <div class="maze-container">
            <canvas id="maze-canvas"></canvas>
        </div>
        
        <div class="stats">
            <p>Generation Time: <span id="gen-time">0</span>ms</p>
            <p>Solution Time: <span id="solve-time">0</span>ms</p>
            <p>Path Length: <span id="path-length">0</span></p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
