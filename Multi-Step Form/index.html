<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-lg shadow-md overflow-hidden">
        <!-- Progress Bar -->
        <div class="px-6 py-4 bg-gray-50 border-b">
            <div class="flex justify-between">
                <div class="step-indicator active" data-step="1">1. Personal Info</div>
                <div class="step-indicator" data-step="2">2. Account Details</div>
                <div class="step-indicator" data-step="3">3. Preferences</div>
                <div class="step-indicator" data-step="4">4. Confirmation</div>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mt-4">
                <div class="bg-blue-600 h-2.5 rounded-full progress-bar" style="width: 25%"></div>
            </div>
        </div>

        <!-- Form Steps -->
        <form id="multiStepForm" class="p-6">
            <!-- Step 1 -->
            <div class="step active" data-step="1">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Personal Information</h2>
                <div class="mb-4">
                    <label for="firstName" class="block text-gray-700 text-sm font-bold mb-2">First Name</label>
                    <input type="text" id="firstName" name="firstName" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="lastName" class="block text-gray-700 text-sm font-bold mb-2">Last Name</label>
                    <input type="text" id="lastName" name="lastName" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="flex justify-end">
                    <button type="button" class="next-step bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Next</button>
                </div>
            </div>

            <!-- Step 2 -->
            <div class="step hidden" data-step="2">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Account Details</h2>
                <div class="mb-4">
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                    <input type="text" id="username" name="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="flex justify-between">
                    <button type="button" class="prev-step bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition">Back</button>
                    <button type="button" class="next-step bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Next</button>
                </div>
            </div>

            <!-- Step 3 -->
            <div class="step hidden" data-step="3">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Preferences</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Newsletter Subscription</label>
                    <div class="flex items-center mb-2">
                        <input type="checkbox" id="newsletter" name="newsletter" class="mr-2">
                        <label for="newsletter">Subscribe to our newsletter</label>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Preferred Communication</label>
                    <select name="communication" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="email">Email</option>
                        <option value="sms">SMS</option>
                        <option value="both">Both</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Interests (Select at least one)</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div class="flex items-center">
                            <input type="checkbox" id="tech" name="interests" value="technology" class="mr-2">
                            <label for="tech">Technology</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="sports" name="interests" value="sports" class="mr-2">
                            <label for="sports">Sports</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="music" name="interests" value="music" class="mr-2">
                            <label for="music">Music</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="travel" name="interests" value="travel" class="mr-2">
                            <label for="travel">Travel</label>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between">
                    <button type="button" class="prev-step bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition">Back</button>
                    <button type="button" class="next-step bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Next</button>
                </div>
            </div>

            <!-- Step 4 -->
            <div class="step hidden" data-step="4">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Confirmation</h2>
                <div class="bg-gray-50 p-4 rounded-md mb-6">
                    <h3 class="font-bold text-lg mb-2">Please review your information:</h3>
                    <div id="reviewContent" class="text-gray-700">
                        <!-- Review content will be inserted here by JavaScript -->
                    </div>
                </div>
                <div class="mb-4">
                    <div class="flex items-center">
                        <input type="checkbox" id="agreeTerms" name="agreeTerms" class="mr-2" required>
                        <label for="agreeTerms">I agree to the terms and conditions</label>
                    </div>
                </div>
                <div class="flex justify-between">
                    <button type="button" class="prev-step bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition">Back</button>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition">Submit</button>
                </div>
            </div>

            <!-- Success Message (hidden by default) -->
            <div id="successMessage" class="hidden p-6 text-center">
                <svg class="mx-auto h-12 w-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <h2 class="mt-4 text-2xl font-bold text-gray-800">Success!</h2>
                <p class="mt-2 text-gray-600">Your form has been submitted successfully.</p>
                <button type="button" id="resetForm" class="mt-6 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Start New Form</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('multiStepForm');
            const steps = document.querySelectorAll('.step');
            const stepIndicators = document.querySelectorAll('.step-indicator');
            const progressBar = document.querySelector('.progress-bar');
            const nextButtons = document.querySelectorAll('.next-step');
            const prevButtons = document.querySelectorAll('.prev-step');
            const successMessage = document.getElementById('successMessage');
            const resetButton = document.getElementById('resetForm');
            
            let currentStep = 1;
            const totalSteps = steps.length;
    
            // Initialize the form
            updateStepVisibility();
            updateProgressBar();
    
            // Next button click handler
            nextButtons.forEach(button => {
                button.addEventListener('click', function() {
                    if (validateStep(currentStep)) {
                        currentStep++;
                        updateStepVisibility();
                        updateProgressBar();
                        updateStepIndicators();
                        
                        // If we're on the review step, populate the review content
                        if (currentStep === 4) {
                            populateReviewContent();
                        }
                    }
                });
            });
    
            // Previous button click handler
            prevButtons.forEach(button => {
                button.addEventListener('click', function() {
                    currentStep--;
                    updateStepVisibility();
                    updateProgressBar();
                    updateStepIndicators();
                });
            });
    
            // Form submission handler
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Validate the final step
                if (!validateStep(currentStep)) {
                    return;
                }
                
                // Here you would typically send the form data to a server
                // For demo purposes, we'll just show the success message
                form.querySelectorAll('.step').forEach(step => {
                    step.classList.add('hidden');
                });
                successMessage.classList.remove('hidden');
                
                // You could also collect all form data and log it or send it to a server
                const formData = new FormData(form);
                const formValues = Object.fromEntries(formData.entries());
                console.log('Form submitted with values:', formValues);
            });
    
            // Reset form handler
            resetButton.addEventListener('click', function() {
                // Reset form fields
                form.reset();
                
                // Reset to step 1
                currentStep = 1;
                updateStepVisibility();
                updateProgressBar();
                updateStepIndicators();
                
                // Hide success message
                successMessage.classList.add('hidden');
            });
    
            // Update which step is visible
            function updateStepVisibility() {
                steps.forEach(step => {
                    const stepNumber = parseInt(step.dataset.step);
                    if (stepNumber === currentStep) {
                        step.classList.remove('hidden');
                        step.classList.add('active');
                    } else {
                        step.classList.add('hidden');
                        step.classList.remove('active');
                    }
                });
            }
    
            // Update progress bar width
            function updateProgressBar() {
                const progressPercentage = (currentStep / totalSteps) * 100;
                progressBar.style.width = `${progressPercentage}%`;
            }
    
            // Update step indicator styling
            function updateStepIndicators() {
                stepIndicators.forEach(indicator => {
                    const indicatorStep = parseInt(indicator.dataset.step);
                    if (indicatorStep < currentStep) {
                        indicator.classList.add('text-blue-600', 'font-bold');
                        indicator.classList.remove('text-gray-500');
                    } else if (indicatorStep === currentStep) {
                        indicator.classList.add('text-blue-600', 'font-bold');
                        indicator.classList.remove('text-gray-500');
                    } else {
                        indicator.classList.add('text-gray-500');
                        indicator.classList.remove('text-blue-600', 'font-bold');
                    }
                });
            }
    
            // Validate current step before proceeding
            function validateStep(stepNumber) {
                let isValid = true;
                
                if (stepNumber === 1) {
                    const firstName = document.getElementById('firstName');
                    const lastName = document.getElementById('lastName');
                    const email = document.getElementById('email');
                    
                    if (!firstName.value.trim()) {
                        showError(firstName, 'First name is required');
                        isValid = false;
                    }
                    
                    if (!lastName.value.trim()) {
                        showError(lastName, 'Last name is required');
                        isValid = false;
                    }
                    
                    if (!email.value.trim()) {
                        showError(email, 'Email is required');
                        isValid = false;
                    } else if (!isValidEmail(email.value)) {
                        showError(email, 'Please enter a valid email');
                        isValid = false;
                    }
                } else if (stepNumber === 2) {
                    const username = document.getElementById('username');
                    const password = document.getElementById('password');
                    const confirmPassword = document.getElementById('confirmPassword');
                    
                    if (!username.value.trim()) {
                        showError(username, 'Username is required');
                        isValid = false;
                    } else if (username.value.trim().length < 4) {
                        showError(username, 'Username must be at least 4 characters');
                        isValid = false;
                    }
                    
                    if (!password.value) {
                        showError(password, 'Password is required');
                        isValid = false;
                    } else if (password.value.length < 6) {
                        showError(password, 'Password must be at least 6 characters');
                        isValid = false;
                    }
                    
                    if (password.value !== confirmPassword.value) {
                        showError(confirmPassword, 'Passwords do not match');
                        isValid = false;
                    }
                } else if (stepNumber === 3) {
                    const interests = document.querySelectorAll('input[name="interests"]:checked');
                    if (interests.length === 0) {
                        alert('Please select at least one interest');
                        isValid = false;
                    }
                } else if (stepNumber === 4) {
                    const agreeTerms = document.getElementById('agreeTerms');
                    if (!agreeTerms.checked) {
                        alert('You must agree to the terms and conditions');
                        isValid = false;
                    }
                }
                
                return isValid;
            }
    
            // Show error message for a form field
            function showError(input, message) {
                const formGroup = input.closest('.mb-4');
                let errorElement = formGroup.querySelector('.error-message');
                
                if (!errorElement) {
                    errorElement = document.createElement('p');
                    errorElement.className = 'error-message text-red-500 text-xs mt-1';
                    formGroup.appendChild(errorElement);
                }
                
                errorElement.textContent = message;
                input.classList.add('border-red-500');
                input.focus();
            }
    
            // Simple email validation
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }
    
            // Populate the review content in the final step
            function populateReviewContent() {
                const reviewContent = document.getElementById('reviewContent');
                const formData = new FormData(form);
                const formValues = Object.fromEntries(formData.entries());
                
                let html = `
                    <div class="mb-2"><strong>Name:</strong> ${formValues.firstName} ${formValues.lastName}</div>
                    <div class="mb-2"><strong>Email:</strong> ${formValues.email}</div>
                    <div class="mb-2"><strong>Username:</strong> ${formValues.username}</div>
                    <div class="mb-2"><strong>Newsletter:</strong> ${formValues.newsletter ? 'Subscribed' : 'Not subscribed'}</div>
                    <div class="mb-2"><strong>Preferred Communication:</strong> ${formValues.communication}</div>
                `;
                
                // Add interests
                if (formValues.interests) {
                    // Handle single selection or multiple selections
                    const interests = Array.isArray(formValues.interests) ? 
                        formValues.interests.join(', ') : 
                        formValues.interests;
                    html += `<div class="mb-2"><strong>Interests:</strong> ${interests}</div>`;
                }
                
                reviewContent.innerHTML = html;
            }
        });
    </script>
</body>
</html>
