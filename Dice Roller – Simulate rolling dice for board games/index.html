<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Dice Roller</h1>
        
        <div class="dice-controls">
            <div class="dice-selector">
                <label for="dice-type">Dice Type:</label>
                <select id="dice-type">
                    <option value="4">d4</option>
                    <option value="6" selected>d6</option>
                    <option value="8">d8</option>
                    <option value="10">d10</option>
                    <option value="12">d12</option>
                    <option value="20">d20</option>
                    <option value="100">d100</option>
                </select>
            </div>
            
            <div class="quantity-selector">
                <label for="dice-quantity">Quantity:</label>
                <input type="number" id="dice-quantity" min="1" max="10" value="1">
            </div>
            
            <button id="roll-btn">Roll Dice</button>
        </div>
        
        <div class="dice-results" id="dice-results">
            <p class="instructions">Click "Roll Dice" to roll</p>
        </div>
        
        <div class="history">
            <h3>Roll History</h3>
            <div class="history-list" id="history-list"></div>
            <button id="clear-history">Clear History</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
