<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Sorting Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Drag & Drop Sorting Game</h1>
        
        <div class="game-info">
            <p>Category: <span id="category">Numbers</span></p>
            <p>Difficulty: <span id="difficulty">Easy</span></p>
            <button id="new-game-btn">New Game</button>
        </div>
        
        <div class="instructions">
            <p>Drag and drop the items to arrange them in the correct order</p>
        </div>
        
        <div class="sorting-area" id="sorting-area">
            <!-- Items will be added here by JavaScript -->
        </div>
        
        <button id="check-btn">Check Order</button>
        
        <div class="result-message" id="result-message"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
