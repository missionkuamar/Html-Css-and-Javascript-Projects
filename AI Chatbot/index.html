<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto max-w-3xl p-4">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-600">AI Chatbot</h1>
        
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Chat container -->
            <div id="chat-container" class="h-96 p-4 overflow-y-auto space-y-4">
                <!-- Messages will appear here -->
                <div class="text-center text-gray-500 py-10">
                    <p>Start a conversation with the AI...</p>
                </div>
            </div>
            
            <!-- Input area -->
            <div class="border-t p-4 bg-gray-50">
                <div class="flex space-x-2">
                    <input 
                        id="user-input" 
                        type="text" 
                        placeholder="Type your message..." 
                        class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                    <button 
                        id="send-btn" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
                    >
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="mt-2 flex items-center">
                    <input 
                        id="api-key" 
                        type="password" 
                        placeholder="Enter your OpenAI API key" 
                        class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                    <small class="ml-2 text-gray-500">Your key stays in your browser</small>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
