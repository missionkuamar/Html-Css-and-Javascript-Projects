<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-hover { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2); }
        .modal { transition: opacity 0.3s ease, transform 0.3s ease; }
        .modal-open { opacity: 1; transform: translateY(0); }
        .modal-closed { opacity: 0; transform: translateY(-20px); }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <aside class="bg-gray-800 text-white w-64 p-4 hidden md:block">
            <h2 class="text-2xl font-bold mb-6">E-Learn</h2>
            <nav>
                <a href="#" id="homeLink" class="block py-2 px-4 rounded hover:bg-gray-700">Home</a>
                <a href="#" id="dashboardLink" class="block py-2 px-4 rounded hover:bg-gray-700">Dashboard</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-8">
            <!-- Header -->
            <header class="bg-white shadow p-4 rounded-lg mb-6">
                <h1 class="text-3xl font-bold text-gray-800">E-Learning Platform</h1>
            </header>

            <!-- Home: Course Catalog -->
            <div id="homeSection">
                <!-- Search and Filters -->
                <div class="bg-white shadow p-6 rounded-lg mb-6">
                    <div class="flex flex-col md:flex-row gap-4">
                        <input type="text" id="searchInput" placeholder="Search courses..." class="w-full md:w-1/3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <select id="categoryFilter" class="w-full md:w-1/3 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">All Categories</option>
                            <option value="Programming">Programming</option>
                            <option value="Design">Design</option>
                            <option value="Business">Business</option>
                        </select>
                    </div>
                </div>

                <!-- Course Listings -->
                <div id="courseListings" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

                <!-- Loading State -->
                <div id="loading" class="text-center hidden">
                    <svg class="animate-spin h-8 w-8 mx-auto text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                </div>
            </div>

            <!-- Dashboard: User Progress -->
            <div id="dashboardSection" class="hidden">
                <h2 class="text-2xl font-bold mb-4">Your Progress</h2>
                <div id="progressListings" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </main>
    </div>

    <!-- Modal for Course Details -->
    <div id="courseModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg max-w-2xl w-full modal modal-closed">
            <h2 id="modalTitle" class="text-2xl font-bold mb-4"></h2>
            <p id="modalCategory" class="text-gray-600 mb-2"></p>
            <p id="modalDescription" class="text-gray-800 mb-4"></p>
            <p id="modalLessons" class="text-gray-600 mb-4"></p>
            <button id="enrollButton" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Enroll</button>
            <button id="closeModal" class="ml-4 text-gray-500 hover:text-gray-700">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
