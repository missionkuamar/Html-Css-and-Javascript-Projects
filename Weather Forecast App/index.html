<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-800 mb-2">☀️ Weather Forecast</h1>
            <p class="text-blue-600">7-day weather forecast for your location</p>
        </header>

        <!-- Search Section -->
        <div class="max-w-md mx-auto mb-8">
            <div class="flex shadow-lg rounded-lg overflow-hidden bg-white">
                <input 
                    type="text" 
                    id="locationInput" 
                    placeholder="Enter city name..."
                    class="flex-grow px-4 py-3 focus:outline-none"
                >
                <button 
                    id="searchBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 transition duration-200"
                >
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="flex justify-center mt-4">
                <button 
                    id="currentLocationBtn"
                    class="text-blue-600 hover:text-blue-800 text-sm flex items-center"
                >
                    <i class="fas fa-location-arrow mr-1"></i> Use my current location
                </button>
            </div>
        </div>

        <!-- Current Weather -->
        <div id="currentWeather" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden mb-8 hidden">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 id="currentLocation" class="text-2xl font-bold text-gray-800"></h2>
                        <p id="currentDate" class="text-gray-600"></p>
                    </div>
                    <div id="currentTemp" class="text-4xl font-bold text-blue-700"></div>
                </div>
                
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center">
                        <div id="currentIcon" class="text-5xl mr-4"></div>
                        <div id="currentConditions" class="text-lg"></div>
                    </div>
                    <div id="currentDetails" class="text-right text-gray-600"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div class="bg-blue-50 p-3 rounded-lg">
                        <div class="text-gray-600 mb-1"><i class="fas fa-wind"></i> Wind</div>
                        <div id="currentWind" class="font-medium"></div>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg">
                        <div class="text-gray-600 mb-1"><i class="fas fa-tint"></i> Humidity</div>
                        <div id="currentHumidity" class="font-medium"></div>
                    </div>
                    <div class="bg-blue-50 p-3 rounded-lg">
                        <div class="text-gray-600 mb-1"><i class="fas fa-eye"></i> Visibility</div>
                        <div id="currentVisibility" class="font-medium"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 7-Day Forecast -->
        <div id="forecastContainer" class="max-w-4xl mx-auto hidden">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">7-Day Forecast</h2>
            <div id="forecastList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-7 gap-4">
                <!-- Forecast cards will be inserted here by JavaScript -->
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center py-12 hidden">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-600 mb-4"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="text-center py-12 text-red-600 hidden">
            <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
            <p class="text-xl">Failed to fetch weather data. Please try again.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
